<html lang="en" data-theme="dark">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <title>Miłosz Sobiecki QA Services</title>
    <script>
      try {
        const theme = localStorage.getItem('ms-theme')
        document.documentElement.dataset.theme =
          theme === 'light' || theme === 'dark' ? theme : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

  </body>
</html>
